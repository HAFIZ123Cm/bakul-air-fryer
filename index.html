<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bakul Air Fryer</title>
<meta name="theme-color" content="#040507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bakul">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Susun atur: app telefon. Kepala ringkas, satu lajur kandungan, dok terapung di bawah (Menu · Kalendar · Belanja · Panduan).
   Tanda pengenalan: dail masa bulat pada setiap resepi (biru/merah = air fryer, jingga = dapur induksi).
   Dua tema boleh tukar: Pagi (biru ke putih) dan Malam (merah gelap ke hitam). */
:root{
  color-scheme:light;
  --grad:linear-gradient(180deg,#B7D3FF 0%,#DDEBFF 22%,#F6FAFF 52%,#FFFFFF 100%);
  --bg:#F6FAFF; --ink:#0A1A33; --muted:#586A8C; --line:#D9E5F7;
  --card:#FFFFFF; --card2:#EDF3FF; --sheet:#FFFFFF; --dock:rgba(255,255,255,.84);
  --acc:#1B5FE3; --acc-ink:#1447B8; --acc-soft:#E2ECFF; --on-acc:#FFFFFF;
  --heat:#C96A04; --heat-soft:#FFF0D9;
  --good:#12804A; --good-soft:#DCF4E6; --warn:#B4360B; --warn-soft:#FFE8DD;
  --hero:linear-gradient(135deg,#1650C9 0%,#2F74F0 50%,#7FB2FF 100%); --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.2);
  --shadow:0 1px 2px rgba(10,26,51,.05),0 8px 24px rgba(27,95,227,.09);
  --scrim:rgba(10,26,51,.45);
  --f-ayam:#F0CDA8; --s-ayam:#C79A6B; --f-daging:#A8483F; --s-daging:#6E2A24;
  --f-kentang:#D9B868; --s-kentang:#9C7D30; --f-roti:#EAD3A2; --s-roti:#B07E3C;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Consolas,monospace;
}
:root[data-skin="malam"]{
  color-scheme:dark;
  --grad:linear-gradient(180deg,#4E0B12 0%,#26060B 24%,#0D0203 56%,#000000 100%);
  --bg:#0B0203; --ink:#FBEFEF; --muted:#C6A6A9; --line:rgba(255,255,255,.1);
  --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.09); --sheet:#1A070A; --dock:rgba(26,6,9,.86);
  --acc:#FF5A5F; --acc-ink:#FF9093; --acc-soft:rgba(255,90,95,.16); --on-acc:#1A0204;
  --heat:#FFB347; --heat-soft:rgba(255,179,71,.15);
  --good:#6EDB9E; --good-soft:rgba(110,219,158,.14); --warn:#FFC069; --warn-soft:rgba(255,192,105,.13);
  --hero:linear-gradient(135deg,#6A0C14 0%,#A81A25 52%,#F0474D 100%); --hero-ink:#FFFFFF; --hero-soft:rgba(0,0,0,.25);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--grad);background-color:var(--bg);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.9rem}

/* kepala */
.appbar{display:flex;align-items:center;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.brand h1 i{font-style:normal;color:var(--acc)}
.brand span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.skin{margin-left:auto;flex:none;display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.skin span{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-weight:700;font-size:.8rem;color:var(--muted)}
.skin svg{width:15px;height:15px;fill:currentColor}
:root:not([data-skin="malam"]) .skin .s-pagi,:root[data-skin="malam"] .skin .s-malam{background:var(--acc);color:var(--on-acc)}

main{padding-block:6px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* dok bawah */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;border-radius:24px;background:var(--dock);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);z-index:15}
.dock button{border:0;background:transparent;border-radius:18px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted)}
.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-current="page"]{background:var(--acc);color:var(--on-acc)}

/* hari ini */
.today{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.today .lbl{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:700}
.today h2{font-size:1.5rem;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.today .picks{display:flex;flex-wrap:wrap;gap:8px}
.today .pick{border:0;background:var(--hero-soft);color:inherit;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.88rem;text-align:left}
.today .cta{align-self:flex-start;border:0;background:#fff;color:#0A1A33;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.today .next{font-size:.85rem;opacity:.9;margin:0}

/* suis alat masak */
.method{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.method button{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.method svg{width:30px;height:30px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.method b{display:block;font-family:var(--f-display);font-size:1.05rem;font-weight:700;line-height:1.1}
.method small{color:var(--muted);font-size:.78rem}
.method button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.method button[aria-pressed="true"] svg{color:var(--acc)}
.method button.in[aria-pressed="true"]{border-color:var(--heat);background:var(--heat-soft)}
.method button.in[aria-pressed="true"] svg{color:var(--heat)}

/* kategori */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.88rem;white-space:nowrap}
.cat .n{font-family:var(--f-mono);font-weight:400;font-size:.74rem;opacity:.65;margin-left:5px}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px}
.search::placeholder{color:var(--muted)}
select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 8px;max-width:46%}
:root[data-skin="malam"] select option{background:#1A070A;color:#FBEFEF}

/* senarai resepi */
.list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:720px){.list{grid-template-columns:1fr 1fr}}
.rc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);min-width:0}
.rc:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.rc:hover{border-color:var(--acc)}
.dial{position:relative;flex:none;width:56px;height:56px;display:grid;place-items:center;color:var(--acc)}
.dial.in{color:var(--heat)}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial .tr{fill:none;stroke:var(--card2);stroke-width:5}
.dial .ar{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round}
.dial b{font-family:var(--f-mono);font-weight:500;font-size:1.05rem;line-height:1;color:var(--ink);display:block;text-align:center}
.dial small{display:block;font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.rc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rc-n{font-family:var(--f-display);font-weight:700;font-size:1.06rem;line-height:1.15}
.rc-m{font-size:.8rem;color:var(--muted)}
.rc-m .num{color:var(--ink)}
.tag{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.chev{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}

/* kotak */
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.box > h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
.box h3{font-size:1rem;font-weight:700;margin:14px 0 6px}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.box li::marker{color:var(--acc);font-weight:700}
.page-h{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:8px 12px;font-weight:600;font-size:.9rem}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.btn.danger{color:var(--warn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.verdict{background:var(--acc-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.verdict b{color:var(--acc-ink)}
.caution{background:var(--warn-soft);border-radius:14px;padding:12px 14px}
.caution b{color:var(--warn)}
.tablewrap{overflow-x:auto;margin:6px 0 12px}
table{border-collapse:collapse;width:100%;min-width:400px;font-size:.9rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.win{color:var(--good);font-weight:700}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
details.acc > summary{list-style:none;cursor:pointer;padding:16px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:10px}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:1.3rem;color:var(--muted)}
details.acc[open] > summary::after{content:"–"}
details.acc > .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
details.acc ul,details.acc ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
details.acc li::marker{color:var(--acc);font-weight:700}
details.acc h3{font-size:1rem;font-weight:700;margin:4px 0 0}
details.acc p{margin:0}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.level{background:var(--card2);border-radius:14px;padding:10px 12px;font-size:.88rem}
.level b{display:block;font-family:var(--f-display);font-size:1rem}
.level .num{color:var(--heat);font-size:.8rem}

/* kalendar */
.calhead{display:flex;align-items:center;gap:8px}
.calhead h2{font-size:1.35rem;font-weight:800;flex:1;letter-spacing:-.01em}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0;font-weight:700}
.day{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1/1.08;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.day:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.day .d{font-family:var(--f-mono);font-size:.9rem;line-height:1.2}
.day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.day .dot.in{background:var(--heat)}
.day .more{font-family:var(--f-mono);font-size:.6rem;color:var(--muted);line-height:1}
.day.out{visibility:hidden}
.day.past{opacity:.55}
.day.today .d{background:var(--ink);color:var(--bg);border-radius:999px;padding:0 6px}
.day.sel{border-color:var(--acc);background:var(--acc-soft);border-width:2px}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:5px}
.legend i.in{background:var(--heat)}
.dayrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow .nm{flex:1;min-width:0;all:unset;cursor:pointer;flex:1;font-weight:600}
.dayrow .nm small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.mdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.mdot.in{background:var(--heat)}
.rm{border:1px solid var(--line);background:transparent;border-radius:10px;width:34px;height:34px;color:var(--muted)}
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.need-t{background:var(--card2);border-radius:14px;padding:10px 12px}
.need-t small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.need-t b{font-family:var(--f-mono);font-weight:500;font-size:1.1rem}

/* belanja */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--card2);border-radius:16px;padding:12px}
.tile small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile b{font-family:var(--f-mono);font-weight:500;font-size:1.3rem}
.tile.big{background:var(--hero);color:var(--hero-ink)}
.tile.big small{color:inherit;opacity:.85}
.tile.big b{font-size:1.8rem}
.bar{display:grid;grid-template-columns:96px 1fr 76px;gap:10px;align-items:center;font-size:.88rem;margin-top:6px}
.bar .track{background:var(--card2);border-radius:6px;height:12px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar .fill.out{background:var(--muted)}
.inline-in{width:72px;border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:4px 8px;font-family:var(--f-mono)}
.shop h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--acc-ink);margin:14px 0 4px;font-family:var(--f-body);font-weight:700}
.shop ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0}
.shop li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.shop li label{display:flex;gap:10px;align-items:baseline;flex:1;min-width:0;cursor:pointer}
.shop li input{accent-color:var(--acc);transform:translateY(2px)}
.shop li .nm{flex:1;min-width:0}
.shop li .nm small{display:block;color:var(--muted);font-size:.78rem}
.shop li .pr{font-family:var(--f-mono);white-space:nowrap;font-size:.9rem}
.shop li.done .nm{text-decoration:line-through;color:var(--muted)}
.shop li.no .pr{color:var(--warn)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow .pn{flex:1;min-width:0}
.prow .pn small{display:block;color:var(--muted);font-size:.78rem}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--card2);width:34px;height:34px;font-weight:700}
.step span{min-width:34px;text-align:center;font-family:var(--f-mono)}
.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.price-grid label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.price-grid input{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 10px;font-family:var(--f-mono);color:var(--ink)}
label.tog{display:flex;gap:8px;align-items:center;cursor:pointer;margin:6px 0}
label.tog input{accent-color:var(--acc)}

/* lukisan potong */
.cutgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cut{background:var(--card2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cut h4{font-size:1.02rem;font-weight:700}
.cut .ref{font-family:var(--f-mono);font-size:.78rem;color:var(--acc-ink)}
.cut ol{font-size:.9rem;gap:3px!important}
.cut .used{font-size:.8rem;color:var(--muted)}
.cut .used button{all:unset;cursor:pointer;color:var(--acc-ink);text-decoration:underline;text-underline-offset:2px}
svg.cv{width:100%;height:auto;display:block;background:var(--card);border-radius:12px;border:1px solid var(--line)}
svg.cv text{fill:var(--muted);font:600 10px var(--f-body)}
svg.cv .stepn{fill:var(--acc-ink);font:500 10px var(--f-mono)}
svg.cv .ay{fill:var(--f-ayam);stroke:var(--s-ayam);stroke-width:1.5}
svg.cv .dg{fill:var(--f-daging);stroke:var(--s-daging);stroke-width:1.5}
svg.cv .kt{fill:var(--f-kentang);stroke:var(--s-kentang);stroke-width:1.5}
svg.cv .rt{fill:var(--f-roti)}
svg.cv .rtc{fill:var(--s-roti)}
svg.cv .hole{fill:var(--card2);stroke:var(--s-roti);stroke-width:1.5}
svg.cv .grain{stroke:var(--s-daging);stroke-width:1.2;fill:none}
svg.cv .knife{stroke:var(--acc);stroke-width:2;stroke-dasharray:4 3;fill:none}
svg.cv .knife.thin{stroke-width:1.2;stroke-dasharray:3 2}
svg.cv .arr{fill:var(--acc)}
svg.cv .grater{fill:var(--card2);stroke:var(--muted);stroke-width:1.5}
svg.cv .slot{stroke:var(--muted);stroke-width:2}
svg.cv .shred{stroke:var(--f-kentang);stroke-width:2.5;fill:none;stroke-linecap:round}
svg.cv .drop{fill:var(--acc)}
svg.cv .fold{stroke:var(--f-ayam);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cv .stick{stroke:var(--s-roti);stroke-width:2.5;stroke-linecap:round}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.size{background:var(--card2);border-radius:12px;padding:8px 10px;font-size:.85rem}
.size b{font-family:var(--f-mono);font-weight:500;color:var(--acc-ink);display:block}

/* helaian */
dialog{border:1px solid var(--line);padding:0;background:var(--sheet);color:var(--ink);border-radius:24px;width:min(640px,calc(100% - 24px));max-height:90dvh;overflow:auto}
dialog::backdrop{background:var(--scrim)}
.sheet{padding:18px;display:flex;flex-direction:column;gap:14px}
.sh-head{display:flex;gap:12px;align-items:center}
.sh-head .dial{width:64px;height:64px}
.sh-head .dial b{font-size:1.2rem}
.sh-head h3{font-size:1.5rem;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.sh-head p{margin:3px 0 0;color:var(--muted);font-size:.88rem}
.sh-head > div{flex:1;min-width:0}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:1rem;line-height:1;align-self:flex-start}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fact{background:var(--card2);border-radius:14px;padding:8px 10px}
.fact b{display:block;font-family:var(--f-mono);font-weight:500;font-size:1rem}
.fact small{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sheet h4{font-family:var(--f-body);font-size:.74rem;margin:0 0 6px;text-transform:uppercase;letter-spacing:.09em;color:var(--acc-ink);font-weight:700}
.sheet ul,.sheet ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
.sheet ol li::marker{font-family:var(--f-mono);color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tip{background:var(--acc-soft);border-radius:14px;padding:12px 14px}
.tip b{color:var(--acc-ink)}
.cutbox{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cutbox .ref{font-family:var(--f-mono);font-size:.78rem;color:var(--acc-ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-btn{border:0;border-radius:16px;padding:14px;font-weight:700;font-size:1rem;background:var(--acc);color:var(--on-acc)}
.big-btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.planbox{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.planbox input[type="date"]{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:7px 8px;color:var(--ink);min-width:0}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:12px}
.clock{font-family:var(--f-mono);font-weight:500;font-size:1.6rem;font-variant-numeric:tabular-nums;background:var(--card2);border-radius:12px;padding:4px 12px}
.timer-msg{flex:1;min-width:130px;font-size:.86rem;color:var(--muted)}
.timer-msg.alert{color:var(--warn);font-weight:700}

/* mod masak */
.cook{padding:18px;display:flex;flex-direction:column;gap:16px;min-height:min(70dvh,560px)}
.cook-top{display:flex;align-items:center;gap:10px}
.cook-top .ttl{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook-prog{display:flex;gap:4px}
.cook-prog i{flex:1;height:5px;border-radius:3px;background:var(--card2)}
.cook-prog i.on{background:var(--acc)}
.cook-n{font-family:var(--f-mono);font-size:.85rem;color:var(--acc-ink)}
.cook-step{font-family:var(--f-display);font-weight:600;font-size:clamp(1.35rem,5.4vw,1.8rem);line-height:1.25;margin:0;flex:1}
.cook-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}

/* pemilih menu */
.pick-list{display:flex;flex-direction:column}
.pick-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.pick-row:focus-visible{outline:3px solid var(--acc)}
.pick-row .nm{flex:1;min-width:0;font-weight:600}
.pick-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.pick-row .plus{font-family:var(--f-mono);color:var(--acc-ink);font-size:1.2rem}
.pick-row.added .plus{color:var(--good)}

.pill{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 7px 7px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 28px)}
.pill button{border:0;background:transparent;color:inherit;padding:4px}
.pill .pname{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.pill .pt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill .px{width:30px;height:30px;border-radius:50%;background:rgba(127,127,127,.3)}
.pill.alert{background:var(--warn);color:#1A0204}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;z-index:40;font-size:.88rem;font-weight:600;white-space:nowrap}

@media (max-width:560px){
  .two{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
  .skin .lbl{display:none}
  .skin span{padding:7px 9px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:24px 24px 0 0;max-height:93dvh;border-bottom:0}
  .sheet,.cook{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .bar{grid-template-columns:80px 1fr 70px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---------- lukisan cara potong ---------- */
const vl = (x,y1,y2,thin) => `<line class="knife${thin?' thin':''}" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>`;
const hl = (y,x1,x2) => `<line class="knife" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`;
const ln = (x1,y1,x2,y2) => `<line class="knife" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const SKIN = '<path class="ay" d="M8 44 C14 26 34 30 48 26 C64 22 84 24 92 40 C98 54 90 66 94 80 C86 96 62 90 46 94 C30 98 10 94 8 78 C4 66 6 56 8 44Z"/>';
const POTATO = (rx=40,ry=26) => `<ellipse class="kt" cx="50" cy="60" rx="${rx}" ry="${ry}"/>`;
const BEEF = '<rect class="dg" x="10" y="32" width="80" height="56" rx="6"/>';
const GRAIN = [42,52,62,72,82].map(y=>`<line class="grain" x1="16" y1="${y}" x2="84" y2="${y}"/>`).join('');
const BREAD = '<path class="rtc" d="M14 46 C14 24 30 20 50 22 C70 20 86 24 86 46 L86 98 L14 98 Z"/><path class="rt" d="M19 47 C19 30 33 27 50 28 C67 27 81 30 81 47 L81 93 L19 93 Z"/>';
function rects(xs, ys, w, h, cls, extra=''){ let s=''; for(const y of ys) for(const x of xs) s+=`<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="3" ${extra}/>`; return s; }
function cutSvg(panels){
  let s = '<svg class="cv" viewBox="0 0 336 128" role="img" aria-hidden="true">';
  panels.forEach(([inner,cap],i)=>{
    const x = 8+i*112;
    s += `<g transform="translate(${x},4)"><text class="stepn" x="2" y="12">${i+1}</text>${inner}<text x="50" y="116" text-anchor="middle">${cap}</text></g>`;
    if(i<panels.length-1) s += `<path class="arr" d="M${x+102} 59 l8 5 l-8 5z"/>`;
  });
  return s + '</svg>';
}
function thinLines(){ let s=''; for(let x=14;x<=86;x+=5){ const h=26*Math.sqrt(Math.max(0,1-((x-50)/40)**2)); s+=vl(x,(60-h).toFixed(1),(60+h).toFixed(1),true); } return s; }
function shreds(){ let s=''; for(let i=0;i<10;i++){ const x=12+i*8; s+=`<path class="shred" d="M${x} ${34+(i%3)*4} q 7 14 0 28 q -6 12 2 24"/>`; } return s+[22,44,66,82].map(x=>`<circle class="drop" cx="${x}" cy="100" r="2.2"/>`).join(''); }
function grater(){ let s='<rect class="grater" x="28" y="18" width="44" height="80" rx="5"/>'; for(let y=28;y<=88;y+=10) s+=`<line class="slot" x1="36" y1="${y}" x2="44" y2="${y}"/><line class="slot" x1="56" y1="${y}" x2="64" y2="${y}"/>`; return s; }
const halfPotato = '<path class="kt" d="M8 78 A42 32 0 0 1 92 78 Z"/>';

const CUTS = {
  kulit:{t:'Kulit ayam segi empat', ref:'4 cm ≈ lebar 2 jari', steps:['Basuh, kemudian lap kering betul-betul dengan tisu. Kulit basah tak akan rangup.','Buang ketulan lemak kuning yang tebal. Simpan untuk dibuat minyak.','Potong segi empat 4 cm. Kulit mengecut separuh bila masak.'],
    svg:()=>cutSvg([[SKIN,'Kulit, lap kering'],[SKIN+vl(36,24,98)+vl(64,22,96)+hl(60,4,98),'Ikut garis'],[rects([8,38,68],[30,62],26,26,'ay'),'Keping 4 cm']])},
  lipat:{t:'Jalur kulit untuk sate', ref:'Jalur 2 cm × panjang jari', steps:['Potong kulit jadi jalur panjang selebar ibu jari.','Lipat jalur berombak-ombak macam langsir.','Cucuk lidi menembusi semua lipatan. 3 hingga 4 jalur satu lidi.'],
    svg:()=>cutSvg([[SKIN+vl(28,26,96)+vl(50,22,96)+vl(72,24,96),'Potong jalur'],['<path class="fold" d="M12 60 Q22 34 32 60 T52 60 T72 60 T92 60"/>','Lipat berombak'],['<path class="fold" d="M14 60 Q22 38 30 60 T46 60 T62 60 T78 60"/><line class="stick" x1="2" y1="60" x2="98" y2="60"/>','Cucuk lidi']])},
  urat:{t:'Daging hiris melintang urat', ref:'±3 mm ≈ tebal 2 syiling ₹1', steps:['Cari garis halus pada daging. Itu arah urat.','Letak pisau bersilang dengan garis itu, bukan selari.','Hiris nipis. Daging separuh beku (30 minit dalam freezer) lebih senang dihiris.'],
    svg:()=>cutSvg([[BEEF+GRAIN,'Garis = urat'],[BEEF+GRAIN+[22,34,46,58,70,82].map(x=>vl(x,26,94)).join(''),'Pisau bersilang urat'],[rects([16,29,42,55,68,81],[32],7,56,'dg'),'Nipis ±3 mm']])},
  batang:{t:'Batang kentang (fries)', ref:'1 cm ≈ lebar jari kelingking', steps:['Potong sedikit satu sisi supaya kentang tak bergolek.','Hiris jadi keping setebal 1 cm.','Susun keping, potong lagi jadi batang 1 cm.'],
    svg:()=>cutSvg([[POTATO(),'Kentang'],[POTATO()+[30,40,50,60,70].map(x=>vl(x,36,84)).join(''),'Keping 1 cm'],[rects([10,22,34,46,58,70,82],[31],9,58,'kt'),'Batang 1 cm']])},
  baji:{t:'Baji kentang (wedges)', ref:'8 baji dari sebiji kentang', steps:['Belah dua kentang memanjang.','Letak bahagian rata di bawah.','Potong setiap separuh jadi 4 baji, dari tengah ke luar macam potong kek.'],
    svg:()=>cutSvg([[POTATO(42,24),'Kentang'],[POTATO(42,24)+hl(60,4,96),'Belah dua memanjang'],[halfPotato+ln(50,78,79.7,55.4)+ln(50,78,50,46)+ln(50,78,20.3,55.4),'4 baji setiap separuh']])},
  dadu:{t:'Dadu kentang', ref:'1.5 cm ≈ saiz dadu permainan', steps:['Hiris kentang jadi keping 1.5 cm.','Potong keping jadi batang 1.5 cm.','Pusing dan potong lagi jadi dadu.'],
    svg:()=>cutSvg([[POTATO(),'Kentang'],[POTATO()+vl(34,38,82)+vl(50,34,86)+vl(66,38,82)+hl(48,14,86)+hl(60,10,90)+hl(72,14,86),'Potong grid'],[rects([12,32,52,72],[34,54,74],15,15,'kt'),'Dadu 1.5 cm']])},
  nipis:{t:'Hiris kentang nipis', ref:'1–2 mm ≈ tebal syiling ₹1', steps:['Guna pengupas sayur (peeler) atau pisau paling tajam.','Hiris senipis boleh, sama tebal semuanya.','Untuk kerepek, terus rendam dalam air sejuk.'],
    svg:()=>cutSvg([[POTATO(),'Kentang'],[POTATO()+thinLines(),'Banyak hirisan nipis'],[[24,36,48,60,72].map(x=>`<ellipse class="kt" cx="${x}" cy="60" rx="14" ry="20"/>`).join(''),'Nipis']])},
  lubang:{t:'Tebuk lubang roti', ref:'Guna mulut gelas atau penutup botol', steps:['Letak roti rata.','Tekan mulut gelas di tengah dan pusing sedikit.','Angkat bulatan. Telur masuk dalam lubang.'],

/* ---------- kira ---------- */
function price(k){ if(k==='c'){ const kg=S.prices.skinKg>0?S.prices.skinKg:1; return S.prices.skinBudget/kg; } return S.prices[k]; }
function mainCost(q){ let c=0; for(const k of ORDER){ const v=q[k]; if(!v) continue; if(k==='e') c+=v*price('e'); else if(k==='r') c+=v*price('r')/SLICES; else c+=v/1000*price(k); } return c; }
function stats(r){
  let p=r.xp||0, k=r.xk||0;
  for(const key of ORDER){ const q=r.q[key]; if(!q) continue; p+=q*ING[key].p; k+=q*ING[key].k; }
  const cost = mainCost(r.q) + r.x;
  return {cost, p, k, total:r.min+r.prep, hp:(p/k*100)>=8};
}
const how = r => r.m==='af' ? r.temp+'°C' : HEAT[r.heat];
function dial(r){
  const c=2*Math.PI*22, f=Math.min(1, r.min/20);
  return `<span class="dial ${r.m==='in'?'in':''}"><svg viewBox="0 0 56 56" aria-hidden="true"><circle class="tr" cx="28" cy="28" r="22"/><circle class="ar" cx="28" cy="28" r="22" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}"/></svg><span><b>${r.min}</b><small>min</small></span></span>`;
}
function totals(ids){
  const g={c:0,b:0,p:0,r:0,e:0}; let n=0, prot=0, extra=0;
  for(const id of ids){ const r=byId(id); if(!r) continue; n++; for(const k of ORDER) g[k]+=(r.q[k]||0); prot+=stats(r).p; extra+=r.x; }
  const kg = v => (v/1000).toFixed(2).replace(/\.?0+$/,'')+' kg';
  const loaves = Math.ceil(g.r/SLICES), eggs = Math.ceil(g.e);
  const lines = [
    {k:'c', qty:kg(g.c), cost:g.c/1000*price('c')},
    {k:'b', qty:kg(g.b), cost:g.b/1000*price('b')},
    {k:'p', qty:kg(g.p), cost:g.p/1000*price('p')},
    {k:'e', qty:eggs+' biji', cost:eggs*price('e')},
    {k:'r', qty:Math.ceil(g.r)+' keping', cost:g.r/SLICES*price('r'), note:loaves+' buku'}
  ].filter(l=>g[l.k]>0);
  return {n, prot, extra, lines, main:lines.reduce((a,l)=>a+l.cost,0)};
}

/* ---------- navigasi ---------- */
function go(v){ if(!VIEWS.includes(v)) v='menu'; if(location.hash!=='#'+v){ location.hash=v; return; } show(v); }
function show(v){ S.view=v; save(); document.querySelectorAll('#dock button').forEach(b=>{ if(b.dataset.view===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); render(); }
window.addEventListener('hashchange', ()=>{ const v=location.hash.slice(1); show(VIEWS.includes(v)?v:'menu'); window.scrollTo({top:0}); });
$('dock').addEventListener('click', e=>{ const b=e.target.closest('[data-view]'); if(b) go(b.dataset.view); });
function render(){ $('main').innerHTML = ({menu:viewMenu, kalendar:viewKalendar, belanja:viewBelanja, panduan:viewPanduan}[S.view])(); }

/* ---------- MENU ---------- */
function menuList(){
  const q = S.q.trim().toLowerCase();
  let list = R.filter(r => r.m===S.m && (S.cat==='all' || r.cat===S.cat) && (!q || r.n.toLowerCase().includes(q) || r.en.toLowerCase().includes(q))).map(r=>({r,s:stats(r)}));
  const f = {fast:(a,b)=>a.s.total-b.s.total, cheap:(a,b)=>a.s.cost-b.s.cost, protein:(a,b)=>b.s.p-a.s.p, light:(a,b)=>a.s.k-b.s.k}[S.sort] || ((a,b)=>a.s.total-b.s.total);
  return list.sort(f);
}
function rowHtml(r,s){
  return `<button type="button" class="rc" data-id="${r.id}">${dial(r)}<span class="rc-b"><span class="rc-n">${r.n}</span><span class="rc-m">${how(r)} · <span class="num">${rs(s.cost)}</span> · ${Math.round(s.p)} g protein</span></span>${s.hp?'<span class="tag">Protein</span>':''}<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`;
}
function todayCard(){
  const t=todayStr(), ids=(S.cal[t]||[]).filter(byId), tm=(S.cal[ymd(addDays(new Date(),1))]||[]).filter(byId);
  return `<section class="today"><span class="lbl">Hari ini · ${niceDate(t)}</span>
    ${ids.length ? `<h2>${ids.length===1?'Menu hari ini':ids.length+' menu hari ini'}</h2><div class="picks">${ids.map(id=>`<button type="button" class="pick" data-open="${id}">${byId(id).n}</button>`).join('')}</div>`
                 : `<h2>Belum ada rancangan untuk hari ini.</h2><button type="button" class="cta" data-pick="${t}">Pilih menu hari ini</button>`}
    ${tm.length?`<p class="next">Esok: ${tm.map(id=>byId(id).n).join(', ')}</p>`:''}</section>`;
}
function listHtml(){
  const list = menuList();
  return list.length ? `<div class="list">${list.map(({r,s})=>rowHtml(r,s)).join('')}</div>` : '<div class="empty">Tiada resepi yang sepadan. Cuba kategori Semua atau kosongkan carian.</div>';
}
function viewMenu(){
  const nAf=R.filter(r=>r.m==='af').length, nIn=R.filter(r=>r.m==='in').length;
  const inM = R.filter(r=>r.m===S.m);
  return `${todayCard()}
  <div class="method" role="group" aria-label="Alat masak">
    <button type="button" data-m="af" aria-pressed="${S.m==='af'}"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="3" width="18" height="26" rx="5"/><rect x="11" y="7" width="10" height="4" rx="1.5"/><rect x="10" y="15" width="12" height="10" rx="2.5"/><path d="M14 20h4"/></svg><span><b>Air Fryer</b><small>${nAf} resepi</small></span></button>
    <button type="button" class="in" data-m="in" aria-pressed="${S.m==='in'}"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="8" width="26" height="16" rx="4"/><circle cx="16" cy="16" r="5.5"/><circle cx="16" cy="16" r="2.2"/></svg><span><b>Dapur Induksi</b><small>${nIn} resepi</small></span></button>

  <div class="tools"><input class="search" id="q" type="search" placeholder="Cari resepi" value="${esc(S.q)}" aria-label="Cari resepi">
    <select id="sort" aria-label="Susun ikut">${[['fast','Paling cepat'],['cheap','Paling murah'],['protein','Protein tinggi'],['light','Kalori rendah']].map(([v,l])=>`<option value="${v}" ${S.sort===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div id="list-wrap">${listHtml()}</div>`;
}

/* ---------- KALENDAR ---------- */
function monthIds(y,m){ const out=[]; const pre=y+'-'+String(m+1).padStart(2,'0')+'-'; for(const [d,ids] of Object.entries(S.cal)) if(d.startsWith(pre)) for(const id of ids) if(byId(id)) out.push(id); return out; }
function viewKalendar(){
  const first=new Date(calY,calM,1), lead=(first.getDay()+6)%7, nDays=new Date(calY,calM+1,0).getDate(), t=todayStr();
  let cells='';
  for(let i=0;i<lead;i++) cells+='<span class="day out"></span>';
  for(let d=1;d<=nDays;d++){
    const ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'), ids=(S.cal[ds]||[]).filter(byId);
    cells+=`<button type="button" class="day${ds===t?' today':''}${ds<t?' past':''}${ds===selDay?' sel':''}" data-day="${ds}" aria-label="${d} ${MONTHS[calM]}, ${ids.length} menu"><span class="d">${d}</span><span class="dots">${ids.slice(0,3).map(id=>`<i class="dot ${byId(id).m==='in'?'in':''}"></i>`).join('')}</span>${ids.length>3?`<span class="more">+${ids.length-3}</span>`:''}</button>`;
  }
  const ids=(S.cal[selDay]||[]).filter(byId);
  const week=[]; for(let i=0;i<7;i++){ const ds=ymd(addDays(new Date(),i)); for(const id of (S.cal[ds]||[])) if(byId(id)) week.push(id); }
  const wt=totals(week);
  return `<div class="calhead"><h2>${MONTHS[calM]} ${calY}</h2><button type="button" class="icon-btn" data-cal="-1" aria-label="Bulan sebelum"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button type="button" class="btn" data-cal="0">Hari ini</button><button type="button" class="icon-btn" data-cal="1" aria-label="Bulan depan"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <div class="cal">${DOW.map(d=>`<span class="dow">${d}</span>`).join('')}${cells}</div>
  <div class="legend"><span><i></i>Air fryer</span><span><i class="in"></i>Dapur induksi</span><span>Tekan tarikh untuk rancang menu</span></div>
  <section class="box"><h2>${niceDate(selDay)}</h2>
    ${ids.length ? ids.map((id,i)=>{ const r=byId(id); return `<div class="dayrow"><i class="mdot ${r.m==='in'?'in':''}"></i><button type="button" class="nm" data-open="${id}">${r.n}<small>${r.m==='af'?'Air fryer':'Dapur induksi'} · ${how(r)} · ${r.min} min · ${rs(stats(r).cost)}</small></button><button type="button" class="rm" data-rm="${i}" aria-label="Buang ${r.n}">✕</button></div>`; }).join('') : '<p class="sub">Belum ada menu untuk hari ini.</p>'}
    <div class="btnrow" style="margin-top:10px"><button type="button" class="btn pri" data-pick="${selDay}">+ Tambah menu</button>${ids.length?`<button type="button" class="btn" data-copy="${selDay}">Salin ke esoknya</button>`:''}</div>
  </section>
  <section class="box"><h2>Bahan untuk 7 hari akan datang</h2>
    ${wt.n ? `<div class="needs">${wt.lines.map(l=>`<div class="need-t"><small>${ING[l.k].ms}</small><b>${l.qty}</b></div>`).join('')}<div class="need-t"><small>Anggaran kos</small><b>${rs(wt.main+wt.extra)}</b></div></div><p class="sub" style="margin:10px 0 0">${wt.n} menu dirancang dari hari ini hingga ${niceDate(ymd(addDays(new Date(),6)))}.</p>` : '<p class="sub">Tiada menu dirancang untuk 7 hari ini. Rancang beberapa hari, dan jumlah bahan yang perlu dibeli akan keluar di sini.</p>'}
  </section>
  <section class="box"><h2>Isi cepat</h2><p class="sub">Tak tahu nak mula? Isi hari-hari kosong bulan ini dengan snek murah dan cepat, satu sehari. Awak boleh ubah selepas itu.</p>
    <div class="btnrow"><button type="button" class="btn" id="fill-sample">Isi contoh bulan ini</button><button type="button" class="btn danger" id="clear-month">Kosongkan bulan ini</button></div></section>`;
}

  const total=t.main+pantry, out=t.n*S.outPrice, max=Math.max(total,out,1), nDays=new Date(calY,calM+1,0).getDate();

      <tr><td>Barang dapur</td><td class="sub">${S.incPantry?'minyak, sos, rempah, bawang':'tidak dikira'}</td><td class="num" style="text-align:right">${rs(pantry)}</td></tr>

    ${SHOP.map(g=>`<h3>${g.g}</h3><ul>${g.items.map(i=>`<li class="${S.bought[i.id]?'done':''} ${i.no?'no':''}"><label for="${i.id}"><input type="checkbox" id="${i.id}" ${S.bought[i.id]?'checked':''}><span class="nm">${i.n}${i.d?`<small>${i.d}</small>`:''}</span></label><span class="pr">${i.p}</span></li>`).join('')}</ul>`).join('')}
    <p class="sub" style="margin-top:10px">Garam, gula dan susu dianggap sudah ada di rumah.</p>

  <section class="box"><h2>Harga bahan utama</h2>
    <div class="price-grid">
      <label for="pr-skinBudget">Kulit ayam: bajet sebulan (₹)<input id="pr-skinBudget" data-k="skinBudget" type="number" min="0" step="any" inputmode="decimal" value="${S.prices.skinBudget}"></label>

      <label for="pr-b">Daging lembu, sekilo (₹)<input id="pr-b" data-k="b" type="number" min="0" step="any" inputmode="decimal" value="${S.prices.b}"></label>
      <label for="pr-p">Kentang, sekilo (₹)<input id="pr-p" data-k="p" type="number" min="0" step="any" inputmode="decimal" value="${S.prices.p}"></label>

/* ---------- PANDUAN ---------- */
function cutBlock(key, note){ const c=CUTS[key]; return `<h4>${c.t}</h4><span class="ref">${c.ref}</span>${c.svg()}<ol>${c.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${note?`<p class="sub" style="margin:0">Untuk resepi ini: ${note}</p>`:''}`; }
function viewPanduan(){
  const used = k => R.filter(r=>CUTMAP[r.id] && CUTMAP[r.id][0]===k);
  return `<h2 class="page-h">Panduan</h2>
  <details class="acc" open><summary>Cara potong</summary><div class="in">
    <div class="sizes"><div class="size"><b>1–2 mm</b>Tebal syiling ₹1</div><div class="size"><b>3 mm</b>Tebal 2 syiling</div><div class="size"><b>1 cm</b>Lebar jari kelingking</div><div class="size"><b>2 cm</b>Lebar ibu jari</div><div class="size"><b>4 cm</b>Lebar 2 jari</div></div>
    <p class="sub">Garis putus-putus ialah tempat pisau. Ikut nombor 1, 2, 3 dari kiri ke kanan.</p>
    <div class="cutgrid">${Object.keys(CUTS).map(k=>`<div class="cut">${cutBlock(k)}<div class="used">Guna dalam: ${used(k).map(r=>`<button type="button" data-open="${r.id}">${r.n}</button>`).join(', ')}</div></div>`).join('')}</div>
  </div></details>
  <details class="acc"><summary>Kulit ayam: yang perlu tahu</summary><div class="in">
    <div class="verdict"><b>Minyak ayam percuma.</b> Setiap kali masak kulit, minyaknya keluar. Tapis ke dalam balang kaca dan simpan dalam peti sejuk, tahan 2 minggu. Guna untuk tumis, goreng telur dan kentang. Jimat minyak masak, dan lebih wangi.</div>
    <ul>
      <li>Lap kering dengan tisu sebelum masak. Ini yang buat kulit rangup dan kurangkan percikan minyak.</li>
      <li>Kulit mengecut separuh. 120 g mentah jadi lebih kurang segenggam.</li>
      <li>Bahagikan kulit mentah 120 g sebungkus dan bekukan. Keluarkan satu bungkus setiap kali.</li>
      <li>Air fryer buang lebih banyak minyak daripada kuali, sebab minyak menitis ke bawah.</li>
    </ul>
    <div class="caution"><b>Jujur tentang kulit ayam.</b> Ia murah dan sedap, tapi tinggi lemak dan rendah protein, lebih kurang 13 g protein bagi 100 g, separuh daripada dada ayam. Jadi hadkan sekitar 120 g sehidangan, makan bersama telur untuk protein, dan tambah timun atau tomato. Telur ialah sumber protein utama dalam menu ini.</div>
  </div></details>
  <details class="acc"><summary>Asas air fryer</summary><div class="in"><ul>
    <li>Panaskan dulu 3 minit pada suhu masakan.</li>
    <li>Satu lapis sahaja. Bakul penuh akan mengukus, bukan merangupkan.</li>

  <details class="acc"><summary>Asas dapur induksi</summary><div class="in">
    <div class="levels"><div class="level"><b>Api perlahan</b><span class="num">± 400–600 W</span><br>Telur hancur, roti keju, reneh kuah.</div><div class="level"><b>Api sederhana</b><span class="num">± 1000–1300 W</span><br>Tumis, goreng telur, kulit ayam, begedil.</div><div class="level"><b>Api kuat</b><span class="num">± 1600–2000 W</span><br>Rebus air, goreng daging cepat.</div></div>

      <li>Kalau minyak terbakar, tutup dengan penutup kuali dan matikan dapur. Jangan sekali-kali siram air.</li>
      <li>Kuali sejuk untuk kulit ayam, kuali panas untuk daging dan telur.</li>

      <tr><td>Snek murah</td><td>Puff / pazham pori ₹15–30, protein 3–6 g</td><td class="win">2 telur rebus ₹20, protein 13 g</td></tr>

      <tr><td>Masa</td><td class="win">0 minit</td><td>3–15 minit kerja</td></tr>
      <tr><td>Kenyang</td><td>Goreng tepung, cepat lapar semula</td><td class="win">Telur dan kentang, lama kenyang</td></tr></tbody></table></div>
    <h3>Kentang beku atau kentang sebenar?</h3>
    <p>Buat sendiri. Kentang beku lebih kurang 8 kali ganda lebih mahal (₹60–70 berbanding ₹8 untuk 200 g) dan sudah separa digoreng di kilang. Wedges cuma 5 minit potong, tak perlu rendam.</p>
    <p class="sub">Harga luar ialah anggaran biasa di Kerala. Ini perspektif umum, bukan nasihat kewangan atau pemakanan berlesen.</p>
  </div></details>
  <details class="acc"><summary>Persediaan hari Ahad, 30 minit</summary><div class="in"><ol>
    <li>Rebus 6 biji telur. Snek untuk 5 hari.</li>
    <li>Lap, potong dan bahagikan kulit ayam 120 g sebungkus. Bekukan.</li>
    <li>Bakar kulit roti lama 160°C selama 5 minit, hancurkan, simpan dalam balang.</li>
    <li>Potong 1 kg kentang, air fry 180°C selama 5 minit, bekukan. Bila nak makan: 200°C selama 15 minit.</li>
    <li>Tapis minyak ayam ke dalam balang.</li>
    <li>Buka Kalendar dan rancang menu minggu depan.</li>
  </ol></div></details>
  <p class="sub">Semua kos, protein dan kalori ialah anggaran kasar untuk satu hidangan. Setiap air fryer dan dapur berbeza, jadi semak masakan pertama.</p>`;
}

/* ---------- interaksi dalam main ---------- */
$('main').addEventListener('click', e=>{
  const g = s => e.target.closest(s);
  let el;
  if(el=g('.rc')) return openRecipe(el.dataset.id);
  if(el=g('[data-open]')) return openRecipe(el.dataset.open);
  if(el=g('[data-pick]')) return openPicker(el.dataset.pick);
  if(el=g('[data-m]')){ S.m=el.dataset.m; if(S.cat!=='all' && !R.some(r=>r.m===S.m&&r.cat===S.cat)) S.cat='all'; save(); return render(); }
  if(el=g('[data-cat]')){ S.cat=el.dataset.cat; save(); return render(); }
  if(el=g('[data-view-go]')) return go(el.dataset.viewGo);
  if(el=g('[data-cal]')){ const d=Number(el.dataset.cal); if(d===0){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); selDay=ymd(n); } else { calM+=d; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} } return render(); }
  if(el=g('[data-day]')){ selDay=el.dataset.day; return render(); }
  if(el=g('[data-rm]')){ const a=(S.cal[selDay]||[]).filter(byId); a.splice(Number(el.dataset.rm),1); if(a.length) S.cal[selDay]=a; else delete S.cal[selDay]; save(); return render(); }
  if(el=g('[data-copy]')){ const nx=ymd(addDays(fromYmd(el.dataset.copy),1)); S.cal[nx]=(S.cal[nx]||[]).concat(S.cal[el.dataset.copy]||[]); save(); selDay=nx; const d=fromYmd(nx); calY=d.getFullYear(); calM=d.getMonth(); toast('Disalin ke '+niceDate(nx)); return render(); }
  if(g('#fill-sample')){ const nDays=new Date(calY,calM+1,0).getDate(), t=todayStr(); let i=0, n=0; for(let d=1;d<=nDays;d++){ const ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); if(ds<t || (S.cal[ds]&&S.cal[ds].length)) continue; S.cal[ds]=[SAMPLE[i++%SAMPLE.length]]; n++; } save(); toast(n?n+' hari diisi':'Tiada hari kosong'); return render(); }
  if(el=g('#clear-month')){ if(el.dataset.sure){ const pre=calY+'-'+String(calM+1).padStart(2,'0')+'-'; for(const d of Object.keys(S.cal)) if(d.startsWith(pre)) delete S.cal[d]; save(); toast('Bulan dikosongkan'); return render(); } el.dataset.sure='1'; el.textContent='Tekan sekali lagi untuk sahkan'; return; }
  if(el=g('[data-pq]')){ const it=PANTRY.find(i=>i.id===el.dataset.pq); const cur=S.pantryQ[it.id] ?? it.q; S.pantryQ[it.id]=Math.max(0,Math.round((cur+Number(el.dataset.d))*2)/2); save(); return render(); }
  if(g('#reset-prices')){ S.prices=Object.assign({},DEFAULT_PRICES); save(); return render(); }
  if(g('#shop-clear')){ S.bought={}; save(); return render(); }
});
$('main').addEventListener('input', e=>{ if(e.target.id==='q'){ S.q=e.target.value; $('list-wrap').innerHTML=listHtml(); } });
$('main').addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='sort'){ S.sort=t.value; save(); return render(); }
  if(t.id==='inc-pantry'){ S.incPantry=t.checked; save(); return render(); }
  if(t.type==='checkbox' && t.closest('.shop')){ S.bought[t.id]=t.checked; save(); t.closest('li').classList.toggle('done', t.checked); return; }
  if(t.id==='out-price' || t.dataset.k){ const v=parseFloat(t.value); if(isNaN(v)||v<0) return; if(t.id==='out-price') S.outPrice=v; else S.prices[t.dataset.k]=v; save(); render(); }
});

/* ---------- helaian resepi ---------- */
const sheet = $('sheet');
let openId = null, cookI = -1;
function idleMsg(r){ return r.flip ? `Berbunyi pada minit ke-${r.flip} untuk ${r.m==='af'?'goncang atau terbalikkan':'kacau atau terbalikkan'}, dan bila siap.` : 'Berbunyi bila siap.'; }
function openRecipe(id){
  const r = byId(id); if(!r) return; openId=id; cookI=-1; const s=stats(r), cm=CUTMAP[r.id];
  const planned = Object.entries(S.cal).filter(([d,ids])=>d>=todayStr() && ids.includes(id)).map(([d])=>d).sort();
  $('sheet-body').innerHTML = `<div class="sheet">
    <div class="sh-head">${dial(r)}<div><h3>${r.n}</h3><p>${r.en}</p></div><button type="button" class="x" data-close aria-label="Tutup">✕</button></div>
    <div class="facts"><div class="fact"><b>${how(r).replace('Api ','')}</b><small>${r.m==='af'?'air fryer':'api induksi'}</small></div><div class="fact"><b>${rs(s.cost)}</b><small>kos</small></div><div class="fact"><b>${Math.round(s.p)} g</b><small>protein</small></div><div class="fact"><b>${Math.round(s.k)}</b><small>kcal</small></div></div>
    <p class="sub" style="margin:0">Lebih kurang ${s.total} minit semuanya · 1 hidangan · tekak ${r.t==='m'?'Melayu':'Barat'}</p>
    ${r.q.b?'<div class="caution"><b>Daging lembu tiada di Instamart.</b> Beli di kedai daging, lebih kurang ₹500 sekilo.</div>':''}
    <div class="actions"><button type="button" class="big-btn" id="cook-go">Mula masak</button><button type="button" class="big-btn ghost" id="plan-toggle">Rancang di kalendar</button></div>
    <div class="planbox" id="planbox" hidden><div class="btnrow"><button type="button" class="btn pri" data-plan="0">Hari ini</button><button type="button" class="btn" data-plan="1">Esok</button><input type="date" id="plan-date" value="${todayStr()}" aria-label="Pilih tarikh"><button type="button" class="btn" data-plan="d">Tambah tarikh ini</button></div><p class="sub" id="plan-info" style="margin:0">${planned.length?'Sudah dirancang: '+planned.map(niceDate).join('; '):'Belum dirancang.'}</p></div>
    <div class="two"><div><h4>Bahan utama</h4><ul>${ORDER.filter(k=>r.q[k]).map(k=>`<li>${ING[k].ms}: ${qtyText(k,r.q[k])}</li>`).join('')}</ul></div><div><h4>Dari dapur</h4><ul>${r.pantry.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
    ${cm?`<div class="cutbox"><h4>Cara potong</h4>${cutBlock(cm[0], cm[1])}</div>`:''}
    <div><h4>Cara buat</h4><ol>${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    <div class="tip"><b>Tip.</b> ${r.tip}</div>
    <div class="timer"><span class="clock" id="t-display">${mmss(r.min*60)}</span><span class="timer-msg" id="t-msg">${idleMsg(r)}</span><button type="button" class="btn pri" id="t-btn">Mula pemasa</button></div>
  </div>`;
  if(!sheet.open) sheet.showModal();
  sheet.scrollTop = 0; tick();
}
function stepSecs(text){ const m=text.match(/(\d+)\s*minit/); return m ? Number(m[1])*60 : 0; }
function renderCook(){
  const r=byId(openId), n=r.steps.length, text=r.steps[cookI], secs=stepSecs(text);
  $('sheet-body').innerHTML = `<div class="cook">
    <div class="cook-top"><button type="button" class="btn" id="cook-back">‹ Resepi</button><span class="ttl">${r.n}</span><button type="button" class="x" data-close aria-label="Tutup">✕</button></div>
    <div class="cook-prog">${r.steps.map((_,i)=>`<i class="${i<=cookI?'on':''}"></i>`).join('')}</div>
    <span class="cook-n">Langkah ${cookI+1} / ${n} · ${how(r)}</span>
    <p class="cook-step">${text}</p>
    ${secs?`<button type="button" class="big-btn ghost" id="cook-timer" data-secs="${secs}">Mula pemasa ${secs/60} minit</button>`:''}
    <div class="cook-nav"><button type="button" class="big-btn ghost" id="cook-prev" ${cookI===0?'disabled':''}>Sebelum</button><button type="button" class="big-btn" id="cook-next">${cookI===n-1?'Siap':'Seterusnya'}</button></div>
  </div>`;
  sheet.scrollTop = 0;
}
/* pemilih menu untuk satu tarikh */
let pickDay=null, pickM='all', pickQ='';
function pickRows(){
  const q=pickQ.trim().toLowerCase(), have=S.cal[pickDay]||[];
  const list=R.filter(r=>(pickM==='all'||r.m===pickM) && (!q||r.n.toLowerCase().includes(q))).sort((a,b)=>a.n.localeCompare(b.n));
  return list.length ? list.map(r=>{ const c=have.filter(x=>x===r.id).length; return `<button type="button" class="pick-row${c?' added':''}" data-add="${r.id}"><i class="mdot ${r.m==='in'?'in':''}"></i><span class="nm">${r.n}<small>${r.m==='af'?'Air fryer':'Induksi'} · ${r.min} min · ${rs(stats(r).cost)}</small></span><span class="plus">${c?'✓'+(c>1?c:''):'+'}</span></button>`; }).join('') : '<p class="sub">Tiada resepi yang sepadan.</p>';
}
function openPicker(day){
  pickDay=day; pickQ=''; openId=null;
  $('sheet-body').innerHTML = `<div class="sheet">
    <div class="sh-head"><div><h3>Tambah menu</h3><p>${niceDate(day)}</p></div><button type="button" class="x" data-close aria-label="Tutup">✕</button></div>
    <input class="search" id="pick-q" type="search" placeholder="Cari resepi" aria-label="Cari resepi">
    <div class="cats">${[['all','Semua'],['af','Air Fryer'],['in','Dapur Induksi']].map(([k,l])=>`<button type="button" class="cat" data-pm="${k}" aria-pressed="${pickM===k}">${l}</button>`).join('')}</div>
    <div class="pick-list" id="pick-list">${pickRows()}</div>
    <button type="button" class="big-btn" data-close>Siap</button>
  </div>`;
  if(!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
}
function addToDay(day,id){ S.cal[day]=(S.cal[day]||[]).concat(id); save(); }
sheet.addEventListener('input', e=>{ if(e.target.id==='pick-q'){ pickQ=e.target.value; $('pick-list').innerHTML=pickRows(); } });
sheet.addEventListener('click', e=>{
  if(e.target===sheet) return sheet.close();
  const g = s => e.target.closest(s); let el;
  if(g('[data-close]')) return sheet.close();
  if(el=g('[data-pm]')){ pickM=el.dataset.pm; sheet.querySelectorAll('[data-pm]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.pm===pickM)); $('pick-list').innerHTML=pickRows(); return; }
  if(el=g('[data-add]')){ addToDay(pickDay, el.dataset.add); $('pick-list').innerHTML=pickRows(); toast(byId(el.dataset.add).n+' ditambah'); return; }
  const r = openId && byId(openId); if(!r) return;
  if(g('#plan-toggle')){ $('planbox').hidden=!$('planbox').hidden; return; }
  if(el=g('[data-plan]')){ const v=el.dataset.plan; const day = v==='d' ? $('plan-date').value : ymd(addDays(new Date(), Number(v))); if(!day) return; addToDay(day, r.id); $('plan-info').textContent='Ditambah untuk '+niceDate(day)+'.'; toast('Dirancang: '+niceDate(day)); return; }
  if(g('#t-btn')){ if(timer && timer.id===r.id) stopTimer(); else startTimer({id:r.id, name:r.n, secs:r.min*60, flip:r.flip?r.flip*60:null}); return; }
  if(g('#cook-go')){ cookI=0; return renderCook(); }
  if(g('#cook-back')) return openRecipe(r.id);
  if(g('#cook-prev')){ if(cookI>0){ cookI--; renderCook(); } return; }
  if(g('#cook-next')){ if(cookI<r.steps.length-1){ cookI++; renderCook(); } else { sheet.close(); toast('Siap! Selamat makan.'); } return; }
  if(el=g('#cook-timer')){ startTimer({id:r.id, name:r.n, secs:Number(el.dataset.secs), flip:null}); toast('Pemasa bermula'); return; }
});
sheet.addEventListener('close', ()=>{ openId=null; cookI=-1; pickDay=null; if(S.view!=='panduan') render(); });

/* ---------- pemasa ---------- */
const FLIP_MSG = 'Goncang atau terbalikkan sekarang!';
let timer = null, ac = null, wake = null;
function ensureAudio(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function beep(n){
  try{ navigator.vibrate && navigator.vibrate(Array(n).fill([300,150]).flat()); }catch(e){}
  if(!ac) return;
  for(let i=0;i<n;i++){ const t=ac.currentTime+i*.4, o=ac.createOscillator(), g=ac.createGain();
    o.type='square'; o.frequency.value=1040; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.28);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.3); }
}
async function keepAwake(){ try{ if('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); }catch(e){} }
function startTimer(o){ ensureAudio(); keepAwake(); timer = {id:o.id, name:o.name, total:o.secs, end:Date.now()+o.secs*1000, flip:o.flip, flipDone:false, done:false, msg:''}; tick(); }
function stopTimer(){ timer=null; try{ wake && wake.release(); }catch(e){} wake=null; tick(); }
function tick(){
  const pill = $('pill');
  if(timer){
    const left=(timer.end-Date.now())/1000, el=timer.total-left;
    if(timer.flip && !timer.flipDone && el>=timer.flip){ timer.flipDone=true; timer.msg=FLIP_MSG; beep(2); setTimeout(()=>{ if(timer && timer.msg===FLIP_MSG) timer.msg=''; }, 20000); }
    if(left<=0 && !timer.done){ timer.done=true; timer.msg='Siap! Periksa makanan.'; beep(3); setTimeout(()=>beep(3),2500); }
    pill.hidden=false; $('pill-open').textContent = timer.msg || timer.name; $('pill-time').textContent = mmss(left); pill.classList.toggle('alert', !!timer.msg);
  } else pill.hidden=true;
  if(openId && cookI<0 && $('t-display')){
    const r=byId(openId), mine = timer && timer.id===openId;
    $('t-display').textContent = mine ? mmss((timer.end-Date.now())/1000) : mmss(r.min*60);
    $('t-btn').textContent = mine ? 'Henti pemasa' : 'Mula pemasa';
    const m=$('t-msg');
    if(mine && timer.msg){ m.textContent=timer.msg; m.classList.add('alert'); }
    else { m.classList.remove('alert'); m.textContent = mine ? 'Sedang berjalan. Biarkan app ini terbuka.' : idleMsg(r); }
  }
}
setInterval(tick, 250);
$('pill-stop').onclick = stopTimer;
$('pill-open').onclick = ()=>{ if(timer && byId(timer.id)) openRecipe(timer.id); };

/* ---------- tema Pagi / Malam ---------- */
function applySkin(s){
  document.documentElement.setAttribute('data-skin', s);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', s==='malam' ? '#4E0B12' : '#B7D3FF');
}
$('skin').addEventListener('click', ()=>{
  const s = document.documentElement.getAttribute('data-skin')==='malam' ? 'pagi' : 'malam';
  try{ localStorage.setItem('bakul-skin', s); }catch(e){}
  applySkin(s); toast(s==='malam' ? 'Tema Malam' : 'Tema Pagi');
});
applySkin(document.documentElement.getAttribute('data-skin') || 'pagi');
