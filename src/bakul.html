<title>Bakul Air Fryer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Susun atur: tajuk ringkas, bar tab melekat (makanan | maklumat), satu paparan pada satu masa. Tema tunggal: hitam + biru. */
:root{
  color-scheme:dark;
  --bg:#040507; --surface:#0D1015; --surface2:#141922; --ink:#EEF2F8; --muted:#8F9BAE; --line:#212936;
  --blue:#3D8BFF; --blue-hi:#8CC0FF; --blue-btn:#2563EB; --blue-tint:#0C1D3A;
  --cyan:#6FD3EE; --cyan-tint:#0A2630;
  --green:#66D693; --green-tint:#0D2818;
  --warn:#FF8A7A; --warn-tint:#2A1210;
  --lcd:#000000; --lcd-text:#6CB6FF;
  --scrim:rgba(0,0,0,.78);
  --f-ayam:#E8C4AE; --s-ayam:#B98C74; --f-daging:#A8483F; --s-daging:#6E2A24;
  --f-kentang:#D9B868; --s-kentang:#9C7D30; --f-roti:#EAD3A2; --s-roti:#B07E3C;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.head{padding-block:24px 14px;display:flex;flex-direction:column;gap:6px}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:900;font-stretch:125%;line-height:.95;letter-spacing:-.02em}
h1 .dot{color:var(--blue)}
.lead{color:var(--muted);margin:0;max-width:60ch}

/* tab bar */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-weight:700;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--blue-btn);border-color:var(--blue-btn);color:#fff}
.tab .n{font-family:var(--f-mono);font-size:.75rem;opacity:.7;margin-left:5px}
.tabsep{flex:none;width:1px;background:var(--line);margin:4px 4px}
.tab.info{background:transparent}
.tab.info[aria-selected="true"]{background:var(--blue-btn)}

main{padding-block:18px 80px}
.view{display:flex;flex-direction:column;gap:16px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--blue-hi);font-weight:700}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px}
.shuffle{margin-left:auto;border:0;border-radius:10px;padding:8px 14px;background:var(--blue-btn);color:#fff;font-weight:700;cursor:pointer}
.count{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin:0}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s;min-width:0}
.card:hover{border-color:var(--blue);transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lcd{font-family:var(--f-mono);font-weight:700;font-size:.78rem;background:var(--lcd);color:var(--lcd-text);border:1px solid #1B2A44;padding:4px 8px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 8px rgba(108,182,255,.45)}
.card .lcd{margin-left:auto}
.chip{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.03em}
.chip.m{background:var(--blue-tint);color:var(--blue-hi)}
.chip.w{background:var(--cyan-tint);color:var(--cyan)}
.chip.hp{background:var(--green-tint);color:var(--green)}
.card-name{font-family:var(--f-display);font-weight:800;font-stretch:108%;font-size:1.15rem;line-height:1.15}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.stats span{display:flex;flex-direction:column}
.stats b{font-family:var(--f-mono);font-size:1rem;font-variant-numeric:tabular-nums}
.stats small{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}

/* boxes */
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.box h2{font-size:1.2rem;font-weight:800;font-stretch:112%;margin-bottom:10px}
.box h3{font-size:1rem;font-weight:800;font-stretch:110%;margin:14px 0 6px}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.box li::marker{color:var(--blue);font-weight:700}
.sub{color:var(--muted);font-size:.9rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.warn{color:var(--warn);font-weight:700}
.verdict{background:var(--blue-tint);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.verdict b{color:var(--blue-hi)}
.tablewrap{overflow-x:auto;margin:6px 0 12px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.win{color:var(--green);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* cutting diagrams */
.cutgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.cut{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cut h3{font-size:1.1rem;font-weight:800;font-stretch:110%;margin:0}
.cut .ref{font-family:var(--f-mono);font-size:.8rem;color:var(--blue-hi)}
.cut ol{margin:0;padding-left:1.2em;font-size:.92rem;display:flex;flex-direction:column;gap:3px}
.cut ol li::marker{color:var(--blue);font-family:var(--f-mono);font-weight:700}
.cut .used{font-size:.82rem;color:var(--muted)}
.cut .used button{all:unset;cursor:pointer;color:var(--blue-hi);text-decoration:underline;text-underline-offset:2px}
svg.cv{width:100%;height:auto;max-width:100%;display:block;background:var(--surface2);border-radius:10px}
svg.cv text{fill:var(--muted);font:600 10px var(--f-body)}
svg.cv .stepn{fill:var(--blue-hi);font:700 10px var(--f-mono)}
svg.cv .ay{fill:var(--f-ayam);stroke:var(--s-ayam);stroke-width:1.5}
svg.cv .dg{fill:var(--f-daging);stroke:var(--s-daging);stroke-width:1.5}
svg.cv .kt{fill:var(--f-kentang);stroke:var(--s-kentang);stroke-width:1.5}
svg.cv .rt{fill:var(--f-roti)}
svg.cv .rtc{fill:var(--s-roti)}
svg.cv .hole{fill:var(--surface2);stroke:var(--s-roti);stroke-width:1.5}
svg.cv .grain{stroke:var(--s-daging);stroke-width:1.2;fill:none;opacity:.9}
svg.cv .knife{stroke:var(--blue);stroke-width:2;stroke-dasharray:4 3;fill:none}
svg.cv .knife.thin{stroke-width:1.2;stroke-dasharray:3 2}
svg.cv .arr{fill:var(--blue)}
svg.cv .grater{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
svg.cv .slot{stroke:var(--muted);stroke-width:2}
svg.cv .shred{stroke:var(--f-kentang);stroke-width:2.5;fill:none;stroke-linecap:round}
svg.cv .drop{fill:var(--blue-hi)}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.size{background:var(--surface2);border-radius:10px;padding:10px 12px}
.size b{font-family:var(--f-mono);color:var(--blue-hi);display:block}

/* cost */
.plan{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow .pn{flex:1;min-width:0}
.prow .pn small{display:block;color:var(--muted);font-size:.78rem}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--surface2);width:34px;height:34px;cursor:pointer;font-weight:700;font-size:1.05rem}
.step span{min-width:34px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addrow select{flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn.pri{background:var(--blue-btn);border-color:var(--blue-btn);color:#fff;font-weight:700}
.total{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface2);border-radius:12px;padding:12px}
.tile small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile b{font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.tile.big{background:var(--blue-tint)}
.tile.big b{color:var(--blue-hi);font-size:1.9rem}
.cmp{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{background:var(--surface2);border-radius:6px;height:14px;overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:6px}
.bar .fill.out{background:var(--warn)}
.inline-in{width:80px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 8px;font-family:var(--f-mono)}
.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:8px}
.price-grid label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.price-grid input{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;font-family:var(--f-mono)}
label.tog{display:flex;gap:8px;align-items:center;cursor:pointer;margin:8px 0}
label.tog input{accent-color:var(--blue)}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.shop h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--blue-hi);margin:0 0 6px;font-stretch:110%}
.shop ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0}
.shop li{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.shop li label{display:flex;gap:10px;align-items:baseline;flex:1;min-width:0;cursor:pointer}
.shop li input{accent-color:var(--blue);transform:translateY(2px)}
.shop li .nm{flex:1;min-width:0}
.shop li .nm small{display:block;color:var(--muted);font-size:.78rem}
.shop li .pr{font-family:var(--f-mono);white-space:nowrap}
.shop li.done .nm{text-decoration:line-through;color:var(--muted)}
.shop li.no .pr{color:var(--warn)}

/* dialog */
dialog{border:1px solid var(--line);padding:0;background:var(--surface);color:var(--ink);border-radius:18px;width:min(660px,calc(100% - 24px));max-height:88dvh;overflow:auto}
dialog::backdrop{background:var(--scrim)}
.sheet{padding:20px;display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;gap:12px;align-items:flex-start}
.sheet-head h3{font-size:1.6rem;font-weight:900;font-stretch:115%;line-height:1.05}
.sheet-head p{margin:4px 0 0;color:var(--muted)}
.x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:1.1rem;line-height:1}
.sheet .stats{grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;padding:10px}
.sheet h4{font-family:var(--f-display);font-stretch:110%;font-size:.95rem;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue-hi)}
.sheet ul,.sheet ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
.sheet ol li::marker{font-family:var(--f-mono);font-weight:700;color:var(--blue)}
.need{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tip{background:var(--blue-tint);border-radius:12px;padding:12px 14px}
.tip b{color:var(--blue-hi)}
.alertbox{background:var(--warn-tint);border-radius:12px;padding:10px 14px;font-size:.9rem}
.alertbox b{color:var(--warn)}
.cutbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px}
.timer .lcd{font-size:1.6rem;padding:6px 12px}
.timer-msg{flex:1;min-width:140px;font-size:.9rem;color:var(--muted)}
.timer-msg.alert{color:var(--warn);font-weight:700}
.go{border:0;border-radius:10px;padding:10px 16px;background:var(--blue-btn);color:#fff;font-weight:700;cursor:pointer}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet-foot .sub{flex:1}

.pill{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--lcd);color:var(--lcd-text);border:1px solid var(--blue);border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 28px rgba(61,139,255,.25);z-index:20;max-width:calc(100% - 32px)}
.pill button{border:0;background:transparent;color:inherit;cursor:pointer;font-family:var(--f-mono);font-weight:700;padding:4px}
.pill .pname{font-family:var(--f-body);font-size:.8rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.pill .pt{font-size:1rem;font-variant-numeric:tabular-nums}
.pill .px{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1)}
.pill.alert{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--surface2);border:1px solid var(--blue);padding:8px 14px;border-radius:10px;z-index:30;font-size:.9rem}

@media (max-width:620px){
  .shuffle{margin-left:0}
  .need{grid-template-columns:1fr}
  .sheet .stats{grid-template-columns:repeat(2,1fr);row-gap:8px}
  .cutgrid{grid-template-columns:1fr}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92dvh}
  .sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .bar{grid-template-columns:80px 1fr 80px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap head">
  <h1>Bakul Air Fryer<span class="dot">.</span></h1>
  <p class="lead">40 snek air fryer yang murah, sihat dan senang, daripada ayam, daging, kentang, roti dan telur.</p>
</div>
<nav class="tabbar" aria-label="Bahagian"><div class="wrap"><div class="tabs" id="tabs" role="tablist"></div></div></nav>
<main class="wrap" id="main"></main>

<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet" id="sheet-body"></div></dialog>
<div class="pill" id="pill" hidden>
  <button type="button" class="pname" id="pill-open"></button>
  <span class="pt" id="pill-time">00:00</span>
  <button type="button" class="px" id="pill-stop" aria-label="Henti pemasa">✕</button>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const ING = {
  c:{ms:'Ayam', sub:'dada / keema', p:.23, k:1.2},
  b:{ms:'Daging', sub:'daging lembu', p:.21, k:1.7},
  p:{ms:'Kentang', sub:'kentang', p:.02, k:.77},
  r:{ms:'Roti', sub:'roti putih', p:2.3, k:66},
  e:{ms:'Telur', sub:'telur ayam', p:6.3, k:72}
};
const ORDER = ['c','b','p','r','e'];
const DEFAULT_PRICES = {c:550, b:500, p:34, r:60, e:9};
const SLICES = 16;
const PRICE_LABEL = {c:'Dada ayam, sekilo', b:'Daging lembu, sekilo (kedai daging)', p:'Kentang, sekilo', r:'Roti putih, sebuku (~16 keping)', e:'Telur, sebiji'};

const TABS = [
  {id:'semua', label:'Semua'},
  {id:'ayam', label:'Ayam', k:'c'},
  {id:'daging', label:'Daging', k:'b'},
  {id:'kentang', label:'Kentang', k:'p'},
  {id:'roti', label:'Roti', k:'r'},
  {id:'telur', label:'Telur', k:'e'},
  {sep:true},
  {id:'potong', label:'Cara Potong', info:true},
  {id:'peringatan', label:'Peringatan', info:true},
  {id:'kos', label:'Kos Sebulan', info:true},
  {id:'beli', label:'Senarai Beli', info:true},
  {id:'tips', label:'Tips', info:true}
];

const SHOP = [
  {g:'Bahan utama', items:[
    {id:'s-ayam', n:'Dada ayam', d:'Meat Window 400 g (diskaun) / Nandus 450 g', p:'₹189–259'},
    {id:'s-keema', n:'Keema ayam', d:'Nandus 500 g. Untuk nugget, burger, begedil', p:'₹249'},
    {id:'s-telur', n:'Telur 30 biji', d:'Fresh Eggs / Dr.Hen, lebih kurang ₹9 sebiji', p:'₹268'},
    {id:'s-roti', n:'Roti putih', d:'English Oven 350 g / Modern 400 g', p:'₹50–60'},
    {id:'s-kentang', n:'Kentang 1 kg', d:'3 kg lagi jimat: ₹99', p:'₹34'},
    {id:'s-daging', n:'Daging lembu', d:'Tiada di Instamart. Beli di kedai daging', p:'~₹500/kg', no:true}
  ]},
  {g:'Barang dapur', items:[
    {id:'s-kicap', n:'Kicap pekat', d:"Ching's Dark Soy 210 g", p:'₹49'},
    {id:'s-soscili', n:'Sos cili', d:'Surabhi Hot n Sweet 450 g', p:'₹49'},
    {id:'s-tomato', n:'Sos tomato', d:'Veeba 900 g', p:'₹88'},
    {id:'s-tiram', n:'Sos tiram', d:'MasterChow 220 g (kadang habis stok)', p:'₹138'},
    {id:'s-kunyit', n:'Serbuk kunyit', d:'Aashirvaad 100 g', p:'₹26'},
    {id:'s-cili', n:'Serbuk cili', d:'MTR 100 g', p:'₹42'},
    {id:'s-lada', n:'Serbuk lada hitam', d:'Aachi 50 g', p:'₹63'},
    {id:'s-bawang', n:'Bawang besar 1 kg', d:'Ada combo bawang + kentang + tomato ₹142', p:'₹72'},
    {id:'s-bputih', n:'Bawang putih 100 g', d:'', p:'₹43'},
    {id:'s-cilihijau', n:'Cili hijau 100 g', d:'', p:'₹14'},
    {id:'s-lemon', n:'Lemon 200 g', d:'', p:'₹40'},
    {id:'s-daunkari', n:'Daun kari 1 ikat', d:'', p:'₹11'},
    {id:'s-timun', n:'Timun 2 biji', d:'', p:'₹22'},
    {id:'s-dadih', n:'Dadih (curd)', d:'Nandini 500 g. Ganti mayonis', p:'₹34'}
  ]},
  {g:'Pilihan, kalau ada bajet lebih', items:[
    {id:'s-keju', n:'Keju keping', d:'Amul 100 g (5 keping)', p:'₹81'},
    {id:'s-pb', n:'Peanut butter', d:'Amul 300 g. Untuk kuah sate', p:'₹100'},
    {id:'s-jagung', n:'Jagung manis beku', d:'Farmland 500 g', p:'₹87'},
    {id:'s-kertas', n:'Kertas minyak', d:'Rush 25 m. Boleh ganti dengan sapu minyak', p:'₹144'}

function rects(xs, ys, w, h, cls, extra=''){ let s=''; for(const y of ys) for(const x of xs) s+=`<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="3" ${extra}/>`; return s; }
function cutSvg(panels){
  let s = '<svg class="cv" viewBox="0 0 336 128" role="img" aria-hidden="true">';
  panels.forEach(([inner,cap],i)=>{
    const x = 8+i*112;
    s += `<g transform="translate(${x},4)"><text class="stepn" x="2" y="12">${i+1}</text>${inner}<text x="50" y="116" text-anchor="middle">${cap}</text></g>`;
    if(i<panels.length-1) s += `<path class="arr" d="M${x+102} 59 l8 5 l-8 5z"/>`;
  });
  return s + '</svg>';
}
function thinLines(){ let s=''; for(let x=14;x<=86;x+=5){ const h=26*Math.sqrt(Math.max(0,1-((x-50)/40)**2)); s+=vl(x,(60-h).toFixed(1),(60+h).toFixed(1),true); } return s; }
function shreds(){ let s=''; for(let i=0;i<10;i++){ const x=12+i*8; s+=`<path class="shred" d="M${x} ${34+(i%3)*4} q 7 14 0 28 q -6 12 2 24"/>`; } return s+[22,44,66,82].map(x=>`<circle class="drop" cx="${x}" cy="100" r="2.2"/>`).join(''); }

function validTab(id){ return TABS.some(t=>t.id===id); }
function renderTabs(){
  $('tabs').innerHTML = TABS.map(t=>{
    if(t.sep) return '<span class="tabsep" aria-hidden="true"></span>';
    const n = t.k ? R.filter(r=>r.q[t.k]).length : (t.id==='semua' ? R.length : null);
    return `<button type="button" role="tab" class="tab${t.info?' info':''}" data-tab="${t.id}" aria-selected="${S.tab===t.id}">${t.label}${n!==null?`<span class="n">${n}</span>`:''}</button>`;
  }).join('');
  const act = $('tabs').querySelector('[aria-selected="true"]'); if(act) act.scrollIntoView({block:'nearest',inline:'nearest'});
}
function go(id){ if(!validTab(id)) id='semua'; if(location.hash !== '#'+id){ location.hash = id; return; } show(id); }
function show(id){ S.tab=id; save(); renderTabs(); renderView(); }
window.addEventListener('hashchange', ()=>{ const id=location.hash.slice(1); show(validTab(id)?id:'semua'); window.scrollTo({top:0}); });
$('tabs').addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(b) go(b.dataset.tab); });

/* ---------- views ---------- */
function renderView(){
  const t = TABS.find(x=>x.id===S.tab);
  const m = $('main');
  if(!t.info) m.innerHTML = viewMenu(t);
  else if(t.id==='potong') m.innerHTML = viewPotong();
  else if(t.id==='peringatan') m.innerHTML = viewPeringatan();
  else if(t.id==='kos') m.innerHTML = viewKos();
  else if(t.id==='beli') m.innerHTML = viewBeli();
  else if(t.id==='tips') m.innerHTML = viewTips();
}

function menuList(t){
  let list = R.filter(r => (!t.k || r.q[t.k]) && (S.taste==='all' || r.t===S.taste)).map(r=>({r,s:stats(r)}));
  const f = {value:(a,b)=>b.s.value-a.s.value, cheap:(a,b)=>a.s.cost-b.s.cost, protein:(a,b)=>b.s.p-a.s.p, fast:(a,b)=>a.s.total-b.s.total, light:(a,b)=>a.s.k-b.s.k}[S.sort];
  return list.sort(f);
}
function viewMenu(t){
  const list = menuList(t);
  const tb = `<div class="toolbar">
    <div class="seg" id="taste" role="group" aria-label="Tekak">${[['all','Semua'],['m','Melayu'],['w','Barat']].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${S.taste===v}">${l}</button>`).join('')}</div>
    <select id="sort" aria-label="Susun ikut">${[['value','Protein paling berbaloi'],['cheap','Paling murah'],['protein','Protein paling tinggi'],['fast','Paling cepat'],['light','Kalori paling rendah']].map(([v,l])=>`<option value="${v}" ${S.sort===v?'selected':''}>${l}</option>`).join('')}</select>
    <button type="button" class="shuffle" id="shuffle">Pilihkan untuk saya</button>
  </div>
  <p class="count">${list.length} snek${t.k?` guna ${ING[t.k].ms.toLowerCase()}`:''}</p>`;
  if(!list.length) return `<div class="view">${tb}<div class="empty">Tiada snek untuk pilihan ini. Tukar tekak ke Semua.</div></div>`;
  return `<div class="view">${tb}<div class="grid">${list.map(({r,s})=>`<button type="button" class="card" data-id="${r.id}">
    <span class="row"><span class="chip ${r.t}">${tasteName(r.t)}</span>${s.hp?'<span class="chip hp">Protein tinggi</span>':''}<span class="lcd">${r.temp}°C · ${r.min} min</span></span>

  </button>`).join('')}</div></div>`;
}

function planCalc(){
  const g={c:0,b:0,p:0,r:0,e:0}; let n=0, prot=0;
  for(const [id,cnt] of Object.entries(S.plan)){ const r=R.find(x=>x.id===id); if(!r||!cnt) continue; n+=cnt; for(const k of ORDER) g[k]+=(r.q[k]||0)*cnt; prot+=stats(r).p*cnt; }
  const P=S.prices, loaves=Math.ceil(g.r/SLICES);
  const lines = [
    {k:'c', qty:(g.c/1000).toFixed(2).replace(/\.?0+$/,'')+' kg', cost:g.c/1000*P.c},
    {k:'b', qty:(g.b/1000).toFixed(2).replace(/\.?0+$/,'')+' kg', cost:g.b/1000*P.b},
    {k:'p', qty:(g.p/1000).toFixed(2).replace(/\.?0+$/,'')+' kg', cost:g.p/1000*P.p},
    {k:'e', qty:Math.ceil(g.e)+' biji', cost:Math.ceil(g.e)*P.e},
    {k:'r', qty:loaves+' buku', cost:loaves*P.r}
  ].filter(l=>g[l.k]>0);
  const main = lines.reduce((a,l)=>a+l.cost,0);
  const pantry = S.incPantry ? PANTRY.reduce((a,i)=>a+i.v*(S.pantryQ[i.id] ?? i.q),0) : 0;
  const total = main+pantry;
  return {n, prot, lines, main, pantry, total, out:n*S.outPrice, outProt:n*S.outProt};
}

/* ---------- interaksi dalam main ---------- */
$('main').addEventListener('click', e=>{
  const card = e.target.closest('.card'); if(card) return openRecipe(card.dataset.id);
  const op = e.target.closest('[data-open]'); if(op) return openRecipe(op.dataset.open);
  const ts = e.target.closest('#taste button'); if(ts){ S.taste=ts.dataset.v; save(); return renderView(); }
  if(e.target.closest('#shuffle')){ const list=menuList(TABS.find(t=>t.id===S.tab)); if(list.length) openRecipe(list[Math.floor(Math.random()*list.length)].r.id); return; }
  const pl = e.target.closest('[data-plan]'); if(pl){ const id=pl.dataset.plan; S.plan[id]=Math.max(0,(S.plan[id]||0)+Number(pl.dataset.d)); if(!S.plan[id]) delete S.plan[id]; save(); return renderView(); }
  const pq = e.target.closest('[data-pq]'); if(pq){ const it=PANTRY.find(i=>i.id===pq.dataset.pq); const cur=S.pantryQ[it.id] ?? it.q; S.pantryQ[it.id]=Math.max(0,Math.round((cur+Number(pq.dataset.d))*2)/2); save(); return renderView(); }
  if(e.target.closest('#plan-add-btn')){ const v=$('plan-add').value; if(v){ S.plan[v]=(S.plan[v]||0)+4; save(); renderView(); } return; }
  if(e.target.closest('#plan-reset')){ S.plan=Object.assign({},PLAN0); save(); return renderView(); }
  if(e.target.closest('#reset-prices')){ S.prices=Object.assign({},DEFAULT_PRICES); save(); return renderView(); }
  if(e.target.closest('#shop-clear')){ S.bought={}; save(); return renderView(); }
});
$('main').addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='sort'){ S.sort=t.value; save(); return renderView(); }
  if(t.id==='inc-pantry'){ S.incPantry=t.checked; save(); return renderView(); }
  if(t.type==='checkbox' && t.closest('.shop')){ S.bought[t.id]=t.checked; save(); t.closest('li').classList.toggle('done', t.checked); return; }
  if(t.id==='out-price' || t.id==='out-prot' || t.dataset.k){
    const v=parseFloat(t.value); if(isNaN(v)||v<0) return;
    if(t.id==='out-price') S.outPrice=v; else if(t.id==='out-prot') S.outProt=v; else S.prices[t.dataset.k]=v;
    save(); renderView();
  }
});

  $('sheet-body').innerHTML = `

      <div class="row" style="margin-bottom:8px"><span class="chip ${r.t}">${tasteName(r.t)}</span>${s.hp?'<span class="chip hp">Protein tinggi</span>':''}<span class="lcd">${r.temp}°C · ${r.min} min</span></div>
      <h3 id="sheet-title">${r.n}</h3><p>${r.en} · lebih kurang ${s.total} minit semua · 1 hidangan</p></div>
      <button type="button" class="x" id="close" aria-label="Tutup">✕</button></div>
    <div class="stats"><span><b>${rs(s.cost)}</b><small>kos</small></span><span><b>${Math.round(s.p)} g</b><small>protein</small></span><span><b>${Math.round(s.k)}</b><small>kcal</small></span><span><b>${s.value.toFixed(1)} g</b><small>protein setiap ₹10</small></span></div>
    ${r.q.b?'<div class="alertbox"><b>Daging lembu tiada di Instamart.</b> Beli di kedai daging (lebih kurang ₹500 sekilo), atau tukar dengan keema ayam Nandus dari Instamart.</div>':''}
    <div class="need">
      <div><h4>Bahan utama</h4><ul>${ORDER.filter(k=>r.q[k]).map(k=>`<li>${ING[k].ms} (${ING[k].sub}): ${qtyText(k,r.q[k])}</li>`).join('')}</ul></div>
      <div><h4>Dari dapur</h4><ul>${r.pantry.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    ${cm?`<div class="cutbox"><h4>Cara potong</h4>${cutBlock(cm[0], cm[1])}</div>`:''}
    <div><h4>Cara buat</h4><ol>${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    <div class="tip"><b>Tip.</b> ${r.tip}</div>
    <div class="timer"><span class="lcd" id="t-display">${mmss(r.min*60)}</span><span class="timer-msg" id="t-msg">${idleMsg(r)}</span><button type="button" class="go" id="t-btn">Mula pemasa</button></div>
    <div class="sheet-foot"><span class="sub">Dalam pelan bulanan: <b id="plan-n">${S.plan[r.id]||0}</b> kali</span><button type="button" class="btn" id="plan-plus">+ Tambah ke pelan bulanan</button></div>`;
  $('close').onclick = ()=>$('sheet').close();
  $('t-btn').onclick = ()=>{ if(timer && timer.id===r.id) stopTimer(); else startTimer(r); };
  $('plan-plus').onclick = ()=>{ S.plan[r.id]=(S.plan[r.id]||0)+1; save(); $('plan-n').textContent=S.plan[r.id]; toast('Ditambah ke pelan bulanan'); if(S.tab==='kos') renderView(); };
  if(!$('sheet').open) $('sheet').showModal();
  $('sheet').scrollTop = 0;
  tick();
}
$('sheet').addEventListener('click', e=>{ if(e.target===$('sheet')) $('sheet').close(); });
$('sheet').addEventListener('close', ()=>{ openId=null; });

/* ---------- pemasa ---------- */
const FLIP_MSG = 'Goncang atau terbalikkan sekarang!';
let timer = null, ac = null, wake = null;
function ensureAudio(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function beep(n){
  try{ navigator.vibrate && navigator.vibrate(Array(n).fill([300,150]).flat()); }catch(e){}
  if(!ac) return;
  for(let i=0;i<n;i++){ const t=ac.currentTime+i*.4, o=ac.createOscillator(), g=ac.createGain();
    o.type='square'; o.frequency.value=1040; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.28);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.3); }
}
async function keepAwake(){ try{ if('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); }catch(e){} }
function startTimer(r){ ensureAudio(); keepAwake(); timer = {id:r.id, name:r.n, total:r.min*60, end:Date.now()+r.min*60000, flip:r.flip?r.flip*60:null, flipDone:false, done:false, msg:''}; tick(); }
function stopTimer(){ timer=null; try{ wake && wake.release(); }catch(e){} wake=null; tick(); }
function tick(){
  const pill = $('pill');
  if(timer){
    const left = (timer.end-Date.now())/1000, el = timer.total-left;
    if(timer.flip && !timer.flipDone && el>=timer.flip){ timer.flipDone=true; timer.msg=FLIP_MSG; beep(2); setTimeout(()=>{ if(timer && timer.msg===FLIP_MSG) timer.msg=''; }, 20000); }
    if(left<=0 && !timer.done){ timer.done=true; timer.msg='Siap! Periksa dan makan.'; beep(3); setTimeout(()=>beep(3),2500); }
    pill.hidden = false;
    $('pill-open').textContent = timer.msg || timer.name;
    $('pill-time').textContent = mmss(left);
    pill.classList.toggle('alert', !!timer.msg);
  } else pill.hidden = true;
  if(openId && $('t-display')){
    const mine = timer && timer.id===openId, r = R.find(x=>x.id===openId);
    $('t-display').textContent = mine ? mmss((timer.end-Date.now())/1000) : mmss(r.min*60);
    $('t-btn').textContent = mine ? 'Henti pemasa' : 'Mula pemasa';
    const m = $('t-msg');
    if(mine && timer.msg){ m.textContent = timer.msg; m.classList.add('alert'); }
    else { m.classList.remove('alert'); m.textContent = mine ? (r.flip && !timer.flipDone ? `Sedang berjalan. Goncang atau terbalikkan pada minit ke-${r.flip}.` : 'Sedang berjalan. Biarkan halaman ini terbuka.') : idleMsg(r); }
  }
}
setInterval(tick, 250);
$('pill-stop').onclick = stopTimer;
$('pill-open').onclick = ()=>{ if(timer) openRecipe(timer.id); };

/* ---------- mula ---------- */
(function init(){ const h=location.hash.slice(1); show(validTab(h)?h:(validTab(S.tab)?S.tab:'semua')); })();
